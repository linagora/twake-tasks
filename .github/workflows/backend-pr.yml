name: Backend PR

# Runs on every pull request, so backend-image-passed can be a required check
# that a frontend-only PR passes by skipping the image.
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo backend=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          pattern='^(apps/backend/|packages/api-contract/|package\.json$|package-lock\.json$|tsconfig\.base\.json$|eslint\.config\.js$|knip\.json$|\.prettierrc$|\.nvmrc$|\.dockerignore$|\.github/workflows/(backend|reusable)-[^/]*\.yml$)'
          echo "backend=$(grep -qE "$pattern" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-check.yml
    with:
      project: backend

  image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-image.yml
    with:
      project: backend
      previous-release: true

  backend-image-passed:
    needs: [changes, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          [ "$CHANGES" = success ] || exit 1
          [ "$IMAGE" = success ] || [ "$IMAGE" = skipped ]
