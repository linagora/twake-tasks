name: Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: npm audit reports advisories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Audit
        id: audit
        run: |
          if npm audit --audit-level=moderate > audit.txt; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          elif [ -s audit.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
          cat audit.txt
      - name: Close the security issue
        if: steps.audit.outputs.found == 'false'
        run: |
          issue=$(gh issue list --label security --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The weekly audit on $(date -u +%F) found no moderate or worse advisories."
          fi
      - name: Open or update the security issue
        if: steps.audit.outputs.found == 'true'
        run: |
          {
            echo "The weekly audit on $(date -u +%F) found moderate or worse advisories. [Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '```'
            head -c 60000 audit.txt
            echo '```'
          } > body.md
          gh label create security --color B60205 --force
          issue=$(gh issue list --label security --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file body.md
          else
            gh issue create --title "$TITLE" --label security --body-file body.md
          fi
