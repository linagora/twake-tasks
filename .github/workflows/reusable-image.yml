name: Image

on:
  workflow_call:
    inputs:
      project:
        description: Directory under apps/, e.g. "backend"
        required: true
        type: string
      push:
        description: Push to GHCR; otherwise build (and smoke test) only. The caller grants packages write.
        required: false
        type: boolean
        default: false
      version:
        description: Release version, pushed next to latest
        required: false
        type: string
        default: ''
      previous-release:
        description: Also smoke test the latest released image on the schema this build migrates
        required: false
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERFILE: apps/${{ inputs.project }}/Dockerfile
      SMOKE_TEST: apps/${{ inputs.project }}/docker/smoke-test.sh
      LOCAL_IMAGE: twake-tasks-${{ inputs.project }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ inputs.project }}
          cache-to: type=gha,mode=max,scope=${{ inputs.project }}

      - name: Smoke test
        run: |
          if [[ -x "$SMOKE_TEST" ]]; then
            "$SMOKE_TEST" "$LOCAL_IMAGE"
          else
            echo "No smoke test for ${{ inputs.project }}"
          fi

      - name: Previous release on the new schema
        if: inputs.previous-release
        env:
          PROJECT: ${{ inputs.project }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        # A tag gets its image only once its release workflow publishes it.
        run: |
          for tag in $(git ls-remote --tags --refs --sort=-v:refname origin "refs/tags/$PROJECT-v*" \
            | grep -oE "$PROJECT-v[0-9]+\.[0-9]+\.[0-9]+$"); do
            image="$REGISTRY/twake-tasks-$PROJECT:${tag#"$PROJECT"-v}"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              exec "$SMOKE_TEST" "$LOCAL_IMAGE" "$image"
            fi
          done
          echo "FAIL no published $PROJECT release image"
          exit 1

      - name: Tags and labels
        if: inputs.push
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/twake-tasks-${{ inputs.project }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.project }}
