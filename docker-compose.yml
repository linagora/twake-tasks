services:
  kafka:
    image: apache/kafka:4.2.2
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
        [
          'CMD',
          '/opt/kafka/bin/kafka-broker-api-versions.sh',
          '--bootstrap-server',
          'localhost:29092'
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-topics:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for topic in twake.tasks.events.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:18
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql
      # The backend refuses a superuser role, which would bypass row level security.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'twake_tasks']
      interval: 5s
      retries: 10

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_SECURITY: plaintext
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://twake_tasks:twake_tasks@postgres:5432/twake_tasks
      APP_URL: ${APP_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://sign-up.twake.app/}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-development-secret}
      LDAP_REST_URL: ${LDAP_REST_URL:-http://host.docker.internal:8081}
      LDAP_REST_SECRET: ${LDAP_REST_SECRET:-local-development-secret}

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - '127.0.0.1:3000:8080'

volumes:
  postgres:
