services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      # As the server's user: run as root, a check that comes between the
      # entrypoint's chown and the server's start writes an Erlang cookie the
      # server cannot read, and it stops on eacces.
      test:
        [
          'CMD',
          'gosu',
          'rabbitmq',
          'rabbitmq-diagnostics',
          '-q',
          'check_port_connectivity'
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:18
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql
      # The backend refuses a superuser role, which would bypass row level security.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'twake_tasks']
      interval: 5s
      retries: 10

  # MinIO no longer publishes images; this is a community build of it.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: [server, /data, --console-address, ':9001']
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  minio-bucket:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 minio minio-secret && mc mb --ignore-existing local/twake-tasks

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://twake_tasks:twake_tasks@postgres:5432/twake_tasks
      DATABASE_MIGRATION_URL: postgres://twake_tasks_owner:twake_tasks_owner@postgres:5432/twake_tasks
      APP_URL: ${APP_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://sign-up.twake.app/}
      # No fallback: the backend refuses to start with an empty secret. Not
      # `:?` either, which would also stop `docker compose up` without the app
      # profile and the e2e and QA stacks that set them in their own files.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SPACE_INTEGRATION: ${SPACE_INTEGRATION:-false}
      LDAP_REST_URL: ${LDAP_REST_URL:-http://host.docker.internal:8081}
      LDAP_REST_SECRET: ${LDAP_REST_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: twake-tasks
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio-secret
      S3_FORCE_PATH_STYLE: 'true'

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    environment:
      API_UPSTREAM: http://backend:8080
      SSO_BASE_URL: ${SSO_BASE_URL:-https://sign-up.twake.app/}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-twaketasks}
      SSO_SCOPE: ${SSO_SCOPE:-openid email profile workplaceFqdn}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:3000/auth/callback}
      SSO_POST_LOGOUT_REDIRECT: ${SSO_POST_LOGOUT_REDIRECT:-http://localhost:3000/}
    ports:
      - '127.0.0.1:3000:8080'

volumes:
  postgres:
  minio:
