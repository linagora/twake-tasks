services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:18
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql
      # The backend refuses a superuser role, which would bypass row level security.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'twake_tasks']
      interval: 5s
      retries: 10

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://twake_tasks:twake_tasks@postgres:5432/twake_tasks
      APP_URL: ${APP_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://sign-up.twake.app/}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-development-secret}
      SPACE_INTEGRATION: ${SPACE_INTEGRATION:-false}
      LDAP_REST_URL: ${LDAP_REST_URL:-http://host.docker.internal:8081}
      LDAP_REST_SECRET: ${LDAP_REST_SECRET:-local-development-secret}

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    environment:
      API_UPSTREAM: http://backend:8080
      SSO_BASE_URL: ${SSO_BASE_URL:-https://sign-up.twake.app/}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-twaketasks}
      SSO_SCOPE: ${SSO_SCOPE:-openid email profile workplaceFqdn}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:3000/auth/callback}
      SSO_POST_LOGOUT_REDIRECT: ${SSO_POST_LOGOUT_REDIRECT:-http://localhost:3000/}
    ports:
      - '127.0.0.1:3000:8080'

volumes:
  postgres:
