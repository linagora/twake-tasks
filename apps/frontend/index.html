<!doctype html>
<html lang="en" class="u-h-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Twake Project</title>
    <script src="<%= assetPrefix %>/.env.js"></script>
    <style>
      .splash {
        --splash-background: #f3f6f9;
        --splash-text: #424244;
        --splash-muted: rgba(66, 66, 68, 0.64);
        --splash-primary: #0a84ff;
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--splash-background);
        color: var(--splash-text);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        text-align: center;
        transition: opacity 200ms ease-out;
      }
      @media (prefers-color-scheme: dark) {
        .splash {
          --splash-background: #2c3039;
          --splash-text: #fff;
          --splash-muted: rgba(255, 255, 255, 0.64);
        }
      }
      .splash-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .splash-icon {
        width: 64px;
        height: 64px;
        color: var(--splash-primary);
      }
      .splash-check {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-dasharray: 9;
        animation: splash-check 2s ease-in-out infinite;
      }
      @keyframes splash-check {
        0% {
          stroke-dashoffset: 9;
          opacity: 1;
        }
        30%,
        70% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        85%,
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }
      .splash-stopped .splash-check {
        animation: none;
      }
      .splash-name,
      .splash-title {
        margin: 16px 0 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.4;
      }
      .splash-status,
      .splash-hint {
        min-height: 20px;
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 20px;
        color: var(--splash-muted);
      }
      .splash-hint {
        margin-top: 8px;
      }
      .splash-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          transition-duration: 1ms;
        }
        .splash-check {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="u-h-100">
    <noscript>You need to enable JavaScript to run Twake Project.</noscript>
    <div id="splash" class="splash">
      <svg
        class="splash-icon"
        viewBox="0 0 13 16"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M8 0H1.6C.72 0 .008.72.008 1.6L0 14.4c0 .88.712 1.6 1.592 1.6H11.2c.88 0 1.6-.72 1.6-1.6V4.8zm3.2 14.4H1.6V1.6h5.6v4h4z"
        />
        <path class="splash-check" d="M3.29 9.4 5.55 11.66 9.52 7.71" />
      </svg>
      <p class="splash-name">Twake Project</p>
      <p class="splash-status"></p>
    </div>
    <div id="root" class="u-h-100"></div>
  </body>
</html>
