cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3
# as in production: after a partition, the losing side restarts and rejoins (a paused node then unpaused heals)
cluster_partition_handling = autoheal
vm_memory_high_watermark.relative = 0.6
# The backend declares its queue `twake-tasks` as a quorum queue (@linagora/rabbitmq-client's default), but its dead
# letter queue `twake-tasks.dlq` with no type: classic, on one node, unless the broker's default is quorum. Quorum by
# default here, every durable queue replicated on the 3 nodes (the live queues are exclusive, classic by declaration).
default_queue_type = quorum
# a quorum queue declared while a node was away gets its third member back once the node is
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.trigger_interval = 10000
