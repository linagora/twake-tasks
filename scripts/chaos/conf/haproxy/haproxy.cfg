# The load balancer of the stack (the service `lb`, aliases `postgres` and `rabbitmq`), as a Kubernetes Service or the
# HAProxy of a Patroni deployment would be. Not a node of a component: never faulted.
#
# PostgreSQL (postgres:5432, the backend's DATABASE_URL): the one address of the primary, Patroni's reference setup. A
# node is in the rotation while its Patroni REST API says it is the primary (GET /primary: 200 on the leader only), so
# after a failover new sessions go to the new primary. A node marked down (no answer within 2 s twice: ~4-6 s for a
# paused one, or no longer the primary) has its sessions cut: the backend's pool reconnects, here, to the new primary.
# Without the cut the backend does not follow a primary that hangs: postgres.js keeps its connections to it, every
# query waits on them (no client-side timeout; a paused node's kernel still acknowledges TCP), as long as it hangs.
#
# RabbitMQ (rabbitmq:5672, the backend's RABBITMQ_URL): the backend takes one URL (@linagora/rabbitmq-client and amqplib
# connect to one host, no list of nodes), so the 3 nodes are behind this address. Plain TCP: an AMQP connection stays
# on the node it reached. A node whose management API does not answer its local health check within 2 s twice is out
# of the rotation, back after 2 good checks. Connections already open on a node that hangs are not cut: the client
# finds out by its own AMQP heartbeats, as it would connected to the node directly.

global
    log stdout format raw local0 warning
    maxconn 4096

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode tcp
    log global
    timeout connect 2s
    # pooled database connections and AMQP connections live long: never cut for idling
    timeout client 3h
    timeout server 3h
    timeout check 2s
    retries 2

listen postgres
    bind :5432
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 port 8008 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 check
    server pg2 pg2:5432 check
    server pg3 pg3:5432 check

frontend amqp
    bind :5672
    default_backend rabbitmq_nodes

backend rabbitmq_nodes
    balance leastconn
    option redispatch
    option httpchk
    # guest:guest, the broker's default user (the backend's RABBITMQ_URL, as the repository's docker-compose.yml)
    http-check send meth GET uri /api/health/checks/local-alarms hdr Authorization "Basic Z3Vlc3Q6Z3Vlc3Q="
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 port 15672 resolvers docker init-addr last,libc,none
    server rabbitmq1 rabbitmq1:5672 check
    server rabbitmq2 rabbitmq2:5672 check
    server rabbitmq3 rabbitmq3:5672 check

# not published: common.sh's checks read it from inside the network
frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
